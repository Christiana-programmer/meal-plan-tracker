{% extends "base.html" %}
{% block content %}
<div class="panel">
  <h2>Transaction history</h2>
  {% for e in expenses %}
    <div class="row">
      <span>{{ e.description }}<br><small>{{ e.category }} · {{ e.date_time[:16].replace('T', ' ') }}</small></span>
      <span class="right">
        <strong>−{{ e.amount|naira }}</strong>
        <a class="btn small" href="{{ url_for('edit_expense', expense_id=e.id) }}">Edit</a>
        <form method="post" action="{{ url_for('delete_expense', expense_id=e.id) }}"
              onsubmit="return confirm('Delete this expense?');">
          <button type="submit" class="danger small">Delete</button>
        </form>
      </span>
    </div>
  {% else %}
    <p class="hint">No expenses recorded yet.</p>
  {% endfor %}
</div>
{% endblock %}
