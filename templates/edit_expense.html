{% extends "base.html" %}
{% block content %}
<div class="panel">
  <h2>Edit expense</h2>
  <form method="post">
    <label>Expense description</label>
    <input type="text" name="description" value="{{ expense.description }}" required>
    <label>Category</label>
    <select name="category">
      {% for c in categories %}<option {% if c == expense.category %}selected{% endif %}>{{ c }}</option>{% endfor %}
    </select>
    <label>Amount spent (₦)</label>
    <input type="number" name="amount" step="0.01" min="0.01" value="{{ expense.amount }}" required>
    <button type="submit">Save Changes</button>
  </form>
</div>
{% endblock %}
